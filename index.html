</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 356, H = 300;

const GROUND = 250, GRAV = 0.55, GOAL = 6200, TAU = Math.PI * 2;
const FARY = GROUND - 60;
const WBOT = GROUND - 26;
const NIGE_TARGET = 5000000;
const GUARD_COST = 25000;

const wrapEl = document.querySelector('.wrap');
const cardEl = document.querySelector('.card');
function fit() {
  const extra = cardEl.offsetHeight - cv.offsetHeight;
  const availH = Math.max(220, window.innerHeight - extra - 24);
  const availW = Math.max(220, window.innerWidth - 24);
  const cssW = Math.min(availW, availH * (W / H), 1024);
  wrapEl.style.maxWidth = cssW + 'px';
  const R = Math.min(4, Math.max(1, cssW * (window.devicePixelRatio || 1) / W));
  cv.width = Math.round(W * R);
  cv.height = Math.round(H * R);
  ctx.setTransform(R, 0, 0, R, 0, 0);
}
fit();
requestAnimationFrame(fit);
let rszT;
window.addEventListener('resize', () => { clearTimeout(rszT); rszT = setTimeout(fit, 100); });
window.addEventListener('orientationchange', () => setTimeout(fit, 250));

// Assets served from this same site.
const CDN = '';
const FILES = {
 binface:'refs/binface_ref.png', brun:'assets/binface_run.png', bjump:'assets/binface_jump.png',
 winface:'assets/just_binface.png', splash:'assets/splash2.png', rules:'assets/nige_rules.png',
 coun:'assets/councillor.png', blob:'assets/blob.png', varm:'assets/var_monitor.png',
 cyclist:'assets/cyclist.png', crash:'assets/cyclist_crash.png', pigeon:'assets/pigeon.png',
 coin:'assets/coin.png', flake:'assets/flake.png', crois:'assets/croissant.png', kebab:'assets/kebab.png',
 nurse:'assets/nhs.png', ceefax:'assets/ceefax.png',
 sign20:'assets/sign_20mph.png', house:'assets/house.png', thames:'assets/thames_tank.png', thamesBoss:'assets/thames_boss.png',
 dryer:'assets/hand_dryer.png', adele:'assets/adele_billboard.png', bridge:'assets/waller_bridge.png',
 fringe:'assets/fringe_plaque.png', library:'assets/library.png',
 flag:'assets/ue_flag.png', barrier:'assets/barrier.png', cone:'assets/cone.png',
 palace:'assets/palace_tile.png', victoria:'assets/victoria_tower.png', bigben:'assets/bigben.png',
 balustrade:'assets/balustrade_tile.png', pier:'assets/pier.png', lamp:'assets/lamp_post.png',
 tree:'assets/tree.png', cloudA:'assets/cloud_a.png', cloudB:'assets/cloud_b.png',
 road:'assets/road_tile.png', decal:'assets/pothole_decal.png', edgeL:'assets/pothole_edge_l.png', edgeR:'assets/pothole_edge_r.png',
 // Nige mode
 nferrari:'assets/nige_ferrari.png', bguard:'assets/bodyguard.png', fan:'assets/councillor_binface.png',
 btc:'assets/bitcoin.png', pinta:'assets/pint_a.png', pintb:'assets/pint_b.png',
 cashbag:'assets/cash_bag.png', gbn:'assets/gbnews.png', nhs250:'assets/nhs_250m.png', bbcqt:'assets/bbcqt.png',
 oneway:'assets/oneway_sign.png', house15:'assets/house_15m.png', gbnewshq:'assets/gbnews_hq.png',
 tory:'assets/tory_plaque.png', sold:'assets/sold_house.png', usaflag:'assets/usa_flag.png',
 gold:'assets/gold_bullion.png'
};
const META = {};
const NO_TRIM = { coun: 1, blob: 1, brun: 1, bjump: 1, pigeon: 1, splash: 1, bguard: 1, fan: 1 };
function buildMeta(k, im) {
  let bx = 0, by = 0, bw = im.naturalWidth, bh = im.naturalHeight;
  if (!NO_TRIM[k]) {
    try {
      const oc = document.createElement('canvas');
      oc.width = bw; oc.height = bh;
      const octx = oc.getContext('2d');
      octx.drawImage(im, 0, 0);
      const d = octx.getImageData(0, 0, bw, bh).data;
      let x0 = bw, x1 = -1, y0 = bh, y1 = -1;
      for (let y = 0; y < bh; y++) {
        for (let x = 0; x < bw; x++) {
          if (d[(y * bw + x) * 4 + 3] > 8) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      if (x1 >= x0) { bx = x0; by = y0; bw = x1 - x0 + 1; bh = y1 - y0 + 1; }
    } catch (e) { }
  }
  META[k] = { im, bx, by, bw, bh };
}
const MISSING = [];
for (const k in FILES) {
  const im = new Image();
  im.src = CDN + FILES[k];
  im.onload = () => buildMeta(k, im);
  im.onerror = () => { MISSING.push(FILES[k]); console.warn('Missing asset:', FILES[k]); };
}
function G(k){ return META[k] || null; }
function dg(g, x, y, dw, dh){ ctx.drawImage(g.im, g.bx, g.by, g.bw, g.bh, x, y, dw, dh); }
function bottomG(g, cx, bottomY, dh, rot) {
  const dw = g.bw * (dh / g.bh);
  ctx.save();
  ctx.translate(cx, bottomY);
  if (rot) ctx.rotate(rot);
  dg(g, -dw/2, -dh, dw, dh);
  ctx.restore();
  return dw;
}
function fmtMoney(n) {
  return (n < 0 ? '\u2212\u00A3' : '\u00A3') + Math.abs(n).toLocaleString('en-GB');
}

const PROP_H = {
  sign20:48, house:58, thames:46, dryer:54, adele:58, bridge:84, fringe:44, library:62, flag:78,
  oneway:48, house15:64, gbnewshq:62, tory:50, sold:72, usaflag:78, gold:58
};
const ITEM_H = {
  coin:18, flake:24, crois:20, kebab:24, nurse:26, ceefax:20,
  btc:18, pinta:24, pintb:24, cashbag:24, gbn:20, nhs250:28, bbcqt:32
};

const SEGS = [
 {x:-60,w:760},{x:770,w:380},{x:1215,w:435},{x:1730,w:420},{x:2220,w:480},
 {x:2785,w:465},{x:3320,w:480},{x:3875,w:475},{x:4435,w:465},{x:4970,w:480},{x:5530,w:1270}
];
function segFor(x){ for (const s of SEGS) if (x >= s.x && x <= s.x + s.w) return s; return null; }

let phase = 'splash';   // 'splash' | 'rules' | 'play'
let state = null;

// ---------- world builders ----------
function buildEnemiesBin() {
  const en = [];
  for (const cx of [850,1000,1350,1850,2050,2450,2950,3150,3550,4100,4550,4750,5100,5350,5700,5950]) {
    const s = segFor(cx);
    en.push({type:'coun', x:cx, y:GROUND-36, w:22, h:36, dir:-1, min:s.x+12, max:s.x+s.w-34, dead:0, t:Math.random()*6});
  }
  for (const bx of [2390,2480,2560]) en.push({type:'blob', x:bx, y:GROUND-20, w:26, h:20, t:Math.random()*6, dead:0});
  for (const kx of [1450,2850,4200,5650]) en.push({type:'cycl', x:kx, y:GROUND-32, w:30, h:32, uni:0, t:0, dead:0});
  en.push({type:'var', x:3450, y:GROUND-28, w:26, h:28, dead:0});
  return en;
}
function buildEnemiesNige() {
  const en = [];
  for (const fx of [900,1300,1750,2100,2500,2900,3300,3700,4150,4600,5000,5400,5800]) {
    en.push({type:'fan', x:fx, y:GROUND-40, w:22, h:40, dead:0, t:Math.random()*6});
  }
  return en;
}
function buildPigeons() {
  const pg = [];
  const spots = [[1600,-58],[1645,-66],[3230,-60],[4650,-62],[4695,-54],[5230,-64]];
  for (const sp of spots) pg.push({x:sp[0], y:GROUND+sp[1], base:GROUND+sp[1], t:Math.random()*6, scared:0});
  return pg;
}
function buildItemsBin() {
  const it = [];
  const coins = [[400,55],[430,55],[460,55],[705,68],[725,82],[745,68],[1655,68],[1678,82],[1700,68],[2705,68],[2728,82],[2750,68],[3805,68],[3828,82],[3850,68],[4905,68],[4928,82],[4950,68]];
  for (const c of coins) it.push({type:'coin', x:c[0], y:GROUND-c[1]});
  it.push({type:'flake', x:950,  y:GROUND-64, lab:'99p Flake',      msg:'+99! The 99 Flake: 99p again'});
  it.push({type:'crois', x:1300, y:GROUND-64, lab:'\u00A31 croissant',   msg:'+100! Croissants capped at \u00A31'});
  it.push({type:'kebab', x:1950, y:GROUND-64, lab:'\u00A32 Wigan kebab', msg:'+200! Wigan kebab capped at \u00A32'});
  it.push({type:'nurse', x:4700, y:GROUND-68, lab:'Nurse pay +1 life', msg:"+1 life! Nurse pay tied to ministers'"});
  it.push({type:'ceefax',x:5250, y:GROUND-72, lab:'CEEFAX returns!', msg:'Ceefax engaged \u2014 teletext invincibility!'});
  return it;
}
function buildItemsNige() {
  const it = [];
  const coins = [[400,55],[430,55],[460,55],[705,68],[725,82],[745,68],[1655,68],[1678,82],[1700,68],[2705,68],[2728,82],[2750,68],[3805,68],[3828,82],[3850,68],[4905,68],[4928,82],[4950,68]];
  for (const c of coins) it.push({type:'btc', x:c[0], y:GROUND-c[1]});
  it.push({type:'pinta',  x:950,  y:GROUND-64, lab:'Hospitality'});
  it.push({type:'pintb',  x:1300, y:GROUND-64, lab:'More hospitality'});
  it.push({type:'cashbag',x:1950, y:GROUND-64, lab:'Donor dinner'});
  it.push({type:'bbcqt',  x:3450, y:GROUND-68, lab:'BBC Question Time'});
  it.push({type:'nhs250', x:4700, y:GROUND-52, lab:'NHS donation??'});
  it.push({type:'gbn',    x:5250, y:GROUND-72, lab:'Presenting fees'});
  return it;
}
const PROPS_BIN = [
 {type:'sign20', x:350,  lab:'Meeting delayed 10 min', msg:'20mph zone \u2014 council meeting delayed 10 minutes'},
 {type:'house',  x:1550, lab:'Affordable house (1 of 1)', msg:"Britain's affordable house (1 of 1). Pledge delivered"},
 {type:'thames', x:2360, lab:'Thames Water dip', msg:'Thames Water boss taking his mandatory dip'},
 {type:'dryer',  x:2660, lab:'Sensible hand dryer', msg:'Hand dryer moved to a sensible place at last'},
 {type:'adele',  x:3050, lab:'', msg:'Adele: nationalised as a state asset'},
 {type:'bridge', x:3650, lab:'', msg:'Now crossing Phoebe Waller-Bridge'},
 {type:'fringe', x:3980, lab:'Grade I listed fringe', msg:"Grade I listed: Claudia Winkleman's fringe"},
 {type:'library',x:4230, lab:'Xmas-music shop, now library', msg:'Christmas music in July? Shop is now a library'},
 {type:'flag',   x:5620, lab:'Union of Europe', msg:'Welcome to the Union of Europe'}
];
const PROPS_NIGE = [
 {type:'oneway',  x:350,  lab:'One way street', msg:'One way: Clacton-on-Sea'},
 {type:'house15', x:1550, lab:'Starter home \u00A31.5m', msg:'Starter home: \u00A31.5m. A bargain, frankly'},
 {type:'thames',  x:2360, lab:'Thames Water dip', msg:'The Thames Water boss is still in there'},
 {type:'gold',    x:3050, lab:'', msg:'BUY GOLD. Buy gold NOW'},
 {type:'sold',    x:3650, lab:'', msg:'SOLD. To whom? Don\u2019t ask'},
 {type:'tory',    x:3980, lab:'RIP CCHQ', msg:'Here lies the Conservative Party'},
 {type:'gbnewshq',x:4230, lab:'GB News HQ', msg:'GB News HQ \u2014 wave to the boss'},
 {type:'usaflag', x:5620, lab:'Visiting constituency', msg:'Just visiting the constituency'}
];

function reset(mode, startNow) {
  state = {
    mode: mode,
    started: !!startNow,
    tick: 0,
    enemies: mode === 'nige' ? buildEnemiesNige() : buildEnemiesBin(),
    items: mode === 'nige' ? buildItemsNige() : buildItemsBin(),
    pigeons: buildPigeons(),
    props: (mode === 'nige' ? PROPS_NIGE : PROPS_BIN).map(p => ({...p, shown:0})),
    px: mode === 'nige' ? 140 : 60,
    py: GROUND - 40, vy: 0, jumps: 0, onGround: true,
    cam: 0, score: 0, money: 0, lives: 3, inv: 0, cee: 0, over: false, won: false,
    speed: 2.5, squish: 1, caps: [], coinMsg: 0, cyclMsg: 0, pigMsg: 0, btcMsg: 0, stompMsg: 0, pledges: 0,
    guards: mode === 'nige'
      ? [0,1,2,3].map(i => ({ py: GROUND - 40, vy: 0, onGround: true, alive: true, jumpAt: 0, popT: 0, popX: 0 }))
      : []
  };
  if (mode === 'nige') {
    document.getElementById('hint').textContent = 'Tap to jump. The bodyguards will follow. Eventually.';
  } else {
    document.getElementById('hint').textContent = 'Tap to jump, tap again for a double jump. Find all 18 pledges.';
  }
  updateHUD();
}
function guardsAlive() { return state.guards.filter(g => g.alive).length; }
function updateHUD() {
  if (!state) return;
  if (state.mode === 'nige') {
    document.getElementById('hudA').innerHTML = 'War chest <b>' + fmtMoney(state.money) + '</b>';
    document.getElementById('hudB').innerHTML = 'Bodyguards <b>' + guardsAlive() + '</b>';
    document.getElementById('line2').innerHTML = 'Reach Parliament with <b>\u00A35,000,000</b>';
  } else {
    document.getElementById('hudA').innerHTML = 'Score <b>' + state.score + '</b>';
    document.getElementById('hudB').innerHTML = 'Lives <b>' + state.lives + '</b>';
    document.getElementById('line2').innerHTML = 'Count Binface manifesto pledges <b>' + state.pledges + '/18</b>';
  }
  document.getElementById('prog').style.width = Math.min(100, (state.cam + state.px) / GOAL * 100).toFixed(1) + '%';
}
function cap(m){ state.caps.push({msg:m, t:150}); }
function pledge(m){ state.pledges++; cap(m); updateHUD(); }
function addMoney(n, msg){ state.money += n; if (msg) cap(msg); updateHUD(); }

function startGame(mode) { phase = 'play'; reset(mode, true); }

function guardRipple() {
  for (let i = 0; i < state.guards.length; i++) {
    const g = state.guards[i];
    if (g.alive) g.jumpAt = state.tick + 6 * (i + 1);
  }
}
function jump() {
  const s = state;
  if (s.over || s.won) return; // handled by the end-screen buttons
  if (s.mode === 'nige') {
    if (s.onGround) { s.vy = -11.2; s.onGround = false; s.jumps = 1; guardRipple(); }
    else if (s.jumps < 2) { s.vy = -9.6; s.jumps = 2; guardRipple(); }
    return;
  }
  if (s.onGround) { s.vy = -10.6; s.onGround = false; s.jumps = 1; }
  else if (s.jumps < 2) { s.vy = -9.2; s.jumps = 2; }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  const y = (e.clientY - r.top) / r.height * H;
  if (phase === 'splash') {
    if (y > H * 0.86) {
      if (x < W / 2) startGame('bin');
      else phase = 'rules';
    }
    return;
  }
  if (phase === 'rules') { startGame('nige'); return; }
  if (state && (state.over || state.won)) {
    const by = H - 40;
    if (y > by - 8 && y < by + 34) {
      if (x > W * 0.13 && x < W * 0.45) { reset(state.mode, true); return; }
      if (x > W * 0.55 && x < W * 0.87) { phase = 'splash'; return; }
    }
    return;
  }
  jump();
});
window.addEventListener('keydown', e => {
  if (e.code === 'KeyB' && phase === 'splash') { startGame('bin'); return; }
  if (e.code === 'KeyN' && phase === 'splash') { phase = 'rules'; return; }
  if (e.code === 'KeyM' && state && (state.over || state.won)) { phase = 'splash'; return; }
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (phase === 'splash') { startGame('bin'); return; }
    if (phase === 'rules') { startGame('nige'); return; }
    if (state && (state.over || state.won)) { reset(state.mode, true); return; }
    jump();
  }
});

function die() {
  state.lives--; updateHUD();
  if (state.lives <= 0) { state.over = true; return; }
  state.inv = 100; state.py = GROUND - 140; state.vy = 0;
  const wx = state.cam + state.px;
  if (!segFor(wx)) {
    let best = SEGS[0];
    for (const s of SEGS) if (s.x < wx + 20) best = s;
    state.cam = Math.max(0, best.x + 30 - state.px);
  }
}
function killGuard(i, msg) {
  const g = state.guards[i];
  if (!g.alive) return;
  g.alive = false;
  g.popT = 1;
  addMoney(-GUARD_COST, msg);
}

function step() {
  if (phase === 'splash') { drawSplash(Date.now()); requestAnimationFrame(step); return; }
  if (phase === 'rules') { drawRules(Date.now()); requestAnimationFrame(step); return; }
  const s = state;
  if (!s.over && !s.won) {
    s.tick++;
    s.speed = Math.min(4.2, 2.5 + (s.cam / GOAL) * 1.7);
    s.cam += s.speed;
    s.vy += GRAV; s.py += s.vy;
    if (s.inv > 0) s.inv--;
    if (s.cee > 0) s.cee--;
    s.squish += (1 - s.squish) * 0.2;

    const wx = s.cam + s.px;
    if (segFor(wx + 8) && s.py >= GROUND - 40 && s.vy >= 0) { s.py = GROUND - 40; s.vy = 0; s.onGround = true; s.jumps = 0; }
    else s.onGround = false;
    if (s.py > H + 40) {
      if (s.mode === 'nige') { s.over = true; }
      else die();
    }

    for (const p of s.props) if (!p.shown && p.x - s.cam < 330) {
      p.shown = 1;
      if (s.mode === 'nige') cap(p.msg); else pledge(p.msg);
    }

    for (const p of s.pigeons) {
      p.t += p.scared ? 0.32 : 0.12;
      if (!p.scared && Math.abs(wx - p.x) < 95) {
        p.scared = 1;
        if (!s.pigMsg) {
          s.pigMsg = 1;
          if (s.mode === 'nige') cap('The pigeons want nothing to do with this');
          else pledge('Pigeons to be granted peerages');
        }
      }
      if (p.scared) { p.x -= 2.2; p.y -= 2.8; }
      else { p.y = p.base + Math.sin(p.t) * 2; p.x -= 0.2; }
    }

    // ----- guards (nige) -----
    if (s.mode === 'nige') {
      for (let i = 0; i < s.guards.length; i++) {
        const g = s.guards[i];
        if (!g.alive) { if (g.popT > 0) g.popT++; continue; }
        if (g.jumpAt && s.tick >= g.jumpAt) {
          g.vy = g.onGround ? -10.4 : -9.2;
          g.onGround = false;
          g.jumpAt = 0;
        }
        g.vy += GRAV; g.py += g.vy;
        const gwx = s.cam + s.px - 44 - i * 26;
        if (segFor(gwx + 10) && g.py >= GROUND - 40 && g.vy >= 0) { g.py = GROUND - 40; g.vy = 0; g.onGround = true; }
        else g.onGround = false;
        if (g.py > H + 30) killGuard(i, 'Bodyguard lost to a pothole: \u2212\u00A325,000');
      }
    }

    // ----- items -----
    const plc = s.mode === 'nige'
      ? { cx: wx + 38, cy: s.py + 22, rx: 30, ry: 30 }
      : { cx: wx + 14, cy: s.py + 22, rx: 18, ry: 28 };
    for (const it of s.items) {
      if (it.taken) continue;
      if (Math.abs(it.x - plc.cx) < plc.rx && Math.abs(it.y - plc.cy) < plc.ry) {
        it.taken = 1;
        if (s.mode === 'nige') {
          if (it.type === 'btc') { s.money += 250000; if (!s.btcMsg) { s.btcMsg = 1; cap('Bitcoin bro bonus: +\u00A3250,000 each'); } updateHUD(); }
          if (it.type === 'pinta' || it.type === 'pintb') addMoney(500000, 'Hospitality received: +\u00A3500,000');
          if (it.type === 'cashbag') addMoney(1000000, 'Donor dinner: +\u00A31,000,000');
          if (it.type === 'bbcqt') addMoney(25000, 'BBC Question Time fee: +\u00A325,000');
          if (it.type === 'nhs250') addMoney(-250000, 'Accidentally funded the NHS: \u2212\u00A3250,000');
          if (it.type === 'gbn') addMoney(1000000, 'GB News presenting fees: +\u00A31,000,000');
        } else {
          if (it.type === 'coin') { s.score += 10; if (!s.coinMsg) { s.coinMsg = 1; pledge('Tax cut for Binface voters (+10 each)'); } }
          if (it.type === 'flake') { s.score += 99; pledge(it.msg); }
          if (it.type === 'crois') { s.score += 100; pledge(it.msg); }
          if (it.type === 'kebab') { s.score += 200; pledge(it.msg); }
          if (it.type === 'nurse') { s.lives = Math.min(4, s.lives + 1); pledge(it.msg); }
          if (it.type === 'ceefax') { s.cee = 300; pledge(it.msg); }
          updateHUD();
        }
      }
    }

    // ----- enemies -----
    if (s.mode === 'nige') {
      const carBox = { x: wx + 2, y: s.py + 14, w: 72, h: 26 };
      for (const e of s.enemies) {
        if (e.dead) { e.dead++; continue; }
        e.t += 0.14; e.x -= 1.5;
        if (e.x + e.w < s.cam - 80) continue;
        // guards first
        let hitGuard = false;
        for (let i = 0; i < s.guards.length; i++) {
          const g = s.guards[i];
          if (!g.alive) continue;
          const gx = s.cam + s.px - 44 - i * 26;
          if (gx < e.x + e.w && gx + 18 > e.x && g.py + 6 < e.y + e.h && g.py + 40 > e.y) {
            e.dead = 1;
            killGuard(i, 'Bodyguard down: \u2212\u00A325,000');
            hitGuard = true;
            break;
          }
        }
        if (hitGuard) continue;
        // car
        if (carBox.x < e.x + e.w && carBox.x + carBox.w > e.x && carBox.y < e.y + e.h && carBox.y + carBox.h > e.y) {
          const stomp = s.vy > 1.2 && carBox.y + carBox.h - s.vy <= e.y + 12;
          if (stomp) {
            e.dead = 1; s.vy = -8.2;
            addMoney(10000, 'Crushed it: +\u00A310,000');
          } else if (s.inv <= 0) {
            let last = -1;
            for (let i = s.guards.length - 1; i >= 0; i--) if (s.guards[i].alive) { last = i; break; }
            if (last >= 0) {
              e.dead = 1; s.inv = 60;
              killGuard(last, 'A bodyguard took one for the team: \u2212\u00A325,000');
            } else {
              s.over = true;
            }
          }
        }
      }
    } else {
      const pl = {x: wx + 4, y: s.py + 4, w: 20, h: 36};
      for (const e of s.enemies) {
        if (e.dead) { e.dead++; continue; }
        if (e.type === 'coun') { e.t += 0.15; e.x += e.dir * 0.65; if (e.x < e.min || e.x > e.max) e.dir *= -1; }
        if (e.type === 'blob') { e.t += 0.07; e.y = GROUND - 20 - Math.abs(Math.sin(e.t)) * 25; }
        if (e.type === 'cycl') { e.t += 0.12; if (!e.uni) e.x -= 1.4; }
        if (e.x + e.w < s.cam - 60) continue;
        if (e.type === 'cycl' && e.uni) continue;
        if (pl.x < e.x + e.w && pl.x + pl.w > e.x && pl.y < e.y + e.h && pl.y + pl.h > e.y) {
          const stomp = s.vy > 1.2 && pl.y + pl.h - s.vy <= e.y + 10;
          if (s.cee > 0 && !stomp) {
            if (e.type === 'cycl') e.uni = 1; else e.dead = 1;
            s.score += 50; updateHUD();
          } else if (stomp) {
            s.vy = -8.8; s.squish = 0.6;
            if (e.type === 'cycl') { e.uni = 1; s.score += 120; if (!s.cyclMsg) { s.cyclMsg = 1; pledge('Rule-breaking cyclist meets natural justice'); } }
            else if (e.type === 'var') { e.dead = 1; s.score += 150; pledge('+150! VAR abolished'); }
            else { e.dead = 1; s.score += e.type === 'coun' ? 100 : 60; }
            updateHUD();
          } else if (e.type !== 'var' && s.inv <= 0) die();
        }
      }
    }
    if (wx >= GOAL) {
      s.won = true;
      if (s.mode === 'bin') s.score += s.lives * 250;
      updateHUD();
    }
  }
  draw();
  requestAnimationFrame(step);
}

function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function label(cx, y, text) {

  ctx.beginPath(); ctx.roundRect(cx - tw/2 - 6, y - 9, tw + 12, 16, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2C2C2A'; ctx.textAlign = 'center';

}

function drawSplash(now) {
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#101722'; ctx.fillRect(0, 0, W, H);
  const sp = G('splash');
  if (sp) {
    const sc = Math.max(W / sp.bw, H / sp.bh);
    const dw = sp.bw * sc, dh = sp.bh * sc;
    dg(sp, (W - dw) / 2, (H - dh) / 2, dw, dh);
  } else {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#E4E6EA';
    ctx.font = '500 24px sans-serif';
    ctx.fillText('COUNT BINFACE', W/2, 100);
    ctx.fillText('RUN FOR OFFICE', W/2, 130);
    rr(W*0.03, H*0.90, W*0.44, 26, 6, '#C0392B');
    rr(W*0.53, H*0.90, W*0.44, 26, 6, '#12B6CF');
    ctx.fillStyle = '#fff'; ctx.font = '500 12px sans-serif';
    ctx.fillText('RUN AS BINFACE', W*0.25, H*0.90 + 17);
    ctx.fillText('RUN AS NIGE', W*0.75, H*0.90 + 17);
    ctx.textAlign = 'left';
  }
  const a = 0.05 + (Math.sin(now / 380) + 1) * 0.055;
  ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
  ctx.beginPath(); ctx.roundRect(W * 0.03, H * 0.90, W * 0.44, H * 0.078, 7); ctx.fill();
  const a2 = 0.05 + (Math.sin(now / 380 + Math.PI) + 1) * 0.055;
  ctx.fillStyle = 'rgba(255,255,255,' + a2.toFixed(3) + ')';
  ctx.beginPath(); ctx.roundRect(W * 0.53, H * 0.90, W * 0.44, H * 0.078, 7); ctx.fill();
  if (MISSING.length) {
    ctx.fillStyle = 'rgba(180,30,30,0.92)';
    ctx.fillRect(0, 0, W, 18);
    ctx.fillStyle = '#fff'; ctx.font = '500 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('\u26A0 ' + MISSING.length + ' asset(s) missing \u2014 open the console (F12) for the list', W/2, 13);
    ctx.textAlign = 'left';
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '400 9px sans-serif';
  ctx.fillText('v2.2', 5, H - 5);
}

function drawRules(now) {

function drawBinface(x, y, sq) {
  if (state.inv > 0 && Math.floor(state.inv / 5) % 2 === 0) return;
  ctx.save();
  ctx.translate(x + 14, y + 40);
  ctx.scale(2 - sq, sq);
  if (state.cee > 0) {
    const cols = ['#E24B4A','#EF9F27','#639922','#378ADD'];
    for (let i = 0; i < 4; i++) { ctx.fillStyle = cols[(i + (Date.now()/100|0)) % 4]; ctx.fillRect(-26, -64 + i * 16, 4, 11); }
  }
  const run = G('brun'), jmp = G('bjump');
  if (run && jmp) {
    let im, fw, fh, fi;
    if (state.onGround) {
      im = run.im;
      fw = im.naturalWidth / 6; fh = im.naturalHeight;
      fi = Math.floor(state.cam / 13) % 6;
    } else {
      im = jmp.im;
      fw = im.naturalWidth / 2; fh = im.naturalHeight;
      fi = state.vy < 0 ? 1 : 0;
    }
    const dh = 54, dw = fw * (dh / fh);
    ctx.drawImage(im, fi * fw, 0, fw, fh, -dw/2, -dh, dw, dh);
    ctx.restore();
    return;
  }
  const g = G('binface');
  if (g) {
    const grounded = state.onGround;
    const t = Date.now() / 80;
    const bob = grounded ? Math.abs(Math.sin(t)) * 2.5 : 0;
    const lean = grounded ? Math.sin(t * 2) * 0.04 : (state.vy < 0 ? -0.09 : 0.06);
    ctx.rotate(lean);
    const dh = 54, dw = g.bw * (dh / g.bh);
    dg(g, -dw/2, -dh - bob, dw, dh);
  }
  ctx.restore();
}

function drawNige(s) {
  const now = Date.now();
  const bg = G('bguard');
  // guards (drawn back-to-front)
  for (let i = s.guards.length - 1; i >= 0; i--) {
    const g = s.guards[i];
    const gsx = s.px - 44 - i * 26;
    if (!g.alive) {
      if (g.popT > 0 && g.popT < 12 && bg) {
        ctx.save();
        ctx.translate(gsx + 9, GROUND);
        ctx.scale(1.4, Math.max(0.08, 1 - g.popT / 10));
        const fw = bg.im.naturalWidth / 6, fh = bg.im.naturalHeight;
        const dh = 42, dw = fw * (dh / fh);
        ctx.drawImage(bg.im, 0, 0, fw, fh, -dw/2, -dh, dw, dh);
        ctx.restore();
      }
      continue;
    }
    if (bg) {
      const fw = bg.im.naturalWidth / 6, fh = bg.im.naturalHeight;
      const fi = (Math.floor(s.cam / 12) + i * 2) % 6;
      const dh = 42, dw = fw * (dh / fh);
      ctx.drawImage(bg.im, fi * fw, 0, fw, fh, gsx + 9 - dw/2, g.py + 40 - dh, dw, dh);
    } else {
      ctx.fillStyle = '#17171B';
      ctx.fillRect(gsx, g.py + 8, 18, 32);
      ctx.fillStyle = '#F0C8A0';
      ctx.beginPath(); ctx.arc(gsx + 9, g.py + 4, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#0B0B0E'; ctx.fillRect(gsx + 4, g.py + 1, 10, 3);
    }
  }
  // car
  if (s.inv > 0 && Math.floor(s.inv / 5) % 2 === 0) return;
  const car = G('nferrari');
  ctx.save();
  ctx.translate(s.px + 38, s.py + 40);
  const tilt = s.onGround ? 0 : Math.max(-0.16, Math.min(0.14, -s.vy * 0.016));
  ctx.rotate(tilt);
  const bob = s.onGround ? Math.sin(now / 90) * 0.8 : 0;
  if (car) {
    const dh = 44, dw = car.bw * (dh / car.bh);
    dg(car, -dw/2, -dh - bob, dw, dh);
  } else {
    rr(-38, -26 - bob, 76, 20, 6, '#C0392B');
    ctx.fillStyle = '#2C2C2A';
    ctx.beginPath(); ctx.arc(-22, -6, 8, 0, TAU); ctx.arc(22, -6, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#F0C8A0'; ctx.beginPath(); ctx.arc(2, -32 - bob, 7, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawPigeon(p, sx) {
  const g = G('pigeon');

    const im = g.im;
    const fw = im.naturalWidth / 2, fh = im.naturalHeight;
    const fi = Math.floor(p.t * 2) % 2;
    const dh = 14, dw = fw * (dh / fh);
    ctx.drawImage(im, fi * fw, 0, fw, fh, sx - dw/2, p.y - dh/2, dw, dh);

}

function drawEnemy(e, sx) {
  ctx.save();
  if (e.dead) { ctx.translate(sx + e.w/2, e.y + e.h); ctx.scale(1.3, Math.max(0.1, 1 - e.dead/10)); ctx.translate(-(sx+e.w/2), -(e.y+e.h)); if (e.dead > 12) { ctx.restore(); return; } }
  if (e.type === 'fan') {
    const g = G('fan');
    if (g) {
      const im = g.im;
      const fw = im.naturalWidth / 6, fh = im.naturalHeight;
      const fi = Math.floor(e.t * 1.4) % 6;
      const dh = 40, dw = fw * (dh / fh);
      ctx.save();
      ctx.translate(sx + 11, e.y + e.h);
      ctx.scale(-1, 1);
      ctx.drawImage(im, fi * fw, 0, fw, fh, -dw/2, -dh, dw, dh);
      ctx.restore();
    } else {
      rr(sx, e.y + 12, 22, 28, 3, '#26262C');
      ctx.fillStyle = '#B2B9C3'; ctx.fillRect(sx + 3, e.y - 4, 16, 18);
      ctx.fillStyle = '#4FCBE4'; ctx.fillRect(sx + 6, e.y + 2, 10, 3);
    }
  } else if (e.type === 'coun') {
    const g = G('coun');
    if (g) {
      const im = g.im;
      const frames = 6;
      const fw = im.naturalWidth / frames, fh = im.naturalHeight;
      const fi = Math.floor(e.t * 1.2) % frames;
      const dh = 40, dw = fw * (dh / fh);
      ctx.save();
      ctx.translate(sx + 11, e.y + e.h);
      if (e.dir === -1) ctx.scale(-1, 1);
      ctx.drawImage(im, fi * fw, 0, fw, fh, -dw/2, -dh, dw, dh);
      ctx.restore();
    }
  } else if (e.type === 'blob') {
    const g = G('blob');
    if (g) {
      const im = g.im;
      const fw = im.naturalWidth / 2, fh = im.naturalHeight;
      const fi = Math.abs(Math.sin(e.t)) < 0.35 ? 1 : 0;
      const dh = 24, dw = fw * (dh / fh);
      ctx.drawImage(im, fi * fw, 0, fw, fh, sx + 13 - dw/2, e.y + 20 - dh, dw, dh);
    }
  } else if (e.type === 'cycl') {
    const g = G('cyclist'), cr = G('crash');
    if (!e.uni && g) {
      const wob = Math.sin(e.t * 3) * 0.04;
      const dh = 36, dw = g.bw * (dh / g.bh);
      ctx.save();
      ctx.translate(sx + 15, e.y + 32 - Math.abs(Math.sin(e.t * 3)) * 1.2);
      ctx.scale(-1, 1);
      if (wob) ctx.rotate(wob);
      dg(g, -dw/2, -dh, dw, dh);
      ctx.restore();
    } else if (e.uni && cr) {
      const dh = 20, dw = cr.bw * (dh / cr.bh);
      dg(cr, sx + 15 - dw/2, e.y + 32 - dh, dw, dh);
    }
  } else if (e.type === 'var') {
    const g = G('varm');
    if (g) bottomG(g, sx + 13, e.y + 28, 32, 0);
  }
  ctx.restore();
}

function drawProp(p, sx) {

function drawPothole(gx0, gx1) {
  const x0 = gx0 - state.cam, x1 = gx1 - state.cam;

  ctx.fillStyle = '#0E0E10';
  ctx.fillRect(x0 - 2, GROUND, x1 - x0 + 4, H - GROUND);
  const el = G('edgeL'), er = G('edgeR');
  if (el && er) {
    dg(el, x0 - 16, GROUND - 2, el.bw * (55 / el.bh), 55);

    ctx.beginPath(); ctx.ellipse((x0+x1)/2, GROUND + 36, Math.max(4,(x1-x0)/2 - 4), 5, 0, 0, TAU); ctx.fill();
  }
  const bx = x0 - 36;

}

function drawSkyline(off, now) {
  const base = GROUND - 116;
  const col = 'rgba(98,132,164,0.48)';
  ctx.fillStyle = col; ctx.strokeStyle = col;
  const P = 760;
  for (let i = Math.floor(off / P) - 1; i < (off + W) / P + 1; i++) {
    const x = i * P - off;
    if (x > W + 60 || x + P < -60) continue;
    ctx.fillRect(x + 8, base - 34, 20, 34);
    ctx.fillRect(x + 32, base - 24, 16, 24);
    ctx.fillRect(x + 52, base - 46, 12, 46);
    ctx.beginPath(); ctx.moveTo(x + 118, base); ctx.lineTo(x + 130, base - 80); ctx.lineTo(x + 142, base); ctx.closePath(); ctx.fill();
    const ex = x + 250, er = 32, ey = base - er - 12;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1;
    const rot = now / 11000;
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = rot + k * TAU / 8;
      ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(a) * er, ey + Math.sin(a) * er);
    }
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 15, base); ctx.lineTo(ex, ey + 4); ctx.lineTo(ex + 15, base); ctx.stroke();
    ctx.fillRect(x + 372, base - 68, 7, 68);
    ctx.fillRect(x + 368, base - 54, 15, 7);
    ctx.fillRect(x + 366, base - 44, 19, 4);
    ctx.beginPath(); ctx.ellipse(x + 452, base - 24, 11, 26, 0, 0, TAU); ctx.fill();
    ctx.fillRect(x + 428, base - 18, 15, 18);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 552, base); ctx.lineTo(x + 552, base - 58);
    ctx.moveTo(x + 528, base - 52); ctx.lineTo(x + 592, base - 52);
    ctx.moveTo(x + 552, base - 58); ctx.lineTo(x + 528, base - 52);
    ctx.moveTo(x + 586, base - 52); ctx.lineTo(x + 586, base - 42);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillRect(x + 636, base - 30, 22, 30);
    ctx.fillRect(x + 664, base - 42, 14, 42);
    ctx.fillRect(x + 700, base - 22, 26, 22);
  }
  const hz = ctx.createLinearGradient(0, base - 6, 0, base + 30);
  hz.addColorStop(0, 'rgba(156,194,228,0)');
  hz.addColorStop(1, 'rgba(170,203,232,0.95)');
  ctx.fillStyle = hz; ctx.fillRect(0, base - 6, W, 40);
}

function drawBirds(now) {
  ctx.strokeStyle = 'rgba(58,72,92,0.7)'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 4; i++) {
    const span = W + 160;
    const bx = ((i * 210 + 60 - now * (0.013 + i * 0.004) - state.cam * 0.1) % span + span) % span - 80;
    const by = 32 + (i * 23 % 52) + Math.sin(now / 700 + i * 2) * 3;
    const f = Math.sin(now / 150 + i * 1.7) * 3.4;
    ctx.beginPath();
    ctx.moveTo(bx - 5, by - f);
    ctx.quadraticCurveTo(bx - 2, by + 1, bx, by);
    ctx.quadraticCurveTo(bx + 2, by + 1, bx + 5, by - f);
    ctx.stroke();
  }
  ctx.lineWidth = 1;
}

function drawBoat(x, y, kind, sc, now) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(22,44,50,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 6, 32, 3, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(236,246,246,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(26, 3); ctx.lineTo(46 + Math.sin(now / 300) * 3, 5.5);
  ctx.moveTo(26, 4.5); ctx.lineTo(38, 8);
  ctx.stroke();
  if (kind === 0) {
    ctx.fillStyle = '#12B6CF';
    ctx.beginPath(); ctx.moveTo(-28, 0); ctx.lineTo(26, 0); ctx.lineTo(31, 4); ctx.lineTo(-31, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F2F1EA';
    ctx.beginPath(); ctx.moveTo(-26, -3); ctx.lineTo(25, -3); ctx.lineTo(27, 0); ctx.lineTo(-28, 0); ctx.closePath(); ctx.fill();
    rr(-19, -10, 32, 7, 2, '#E7E8E3');
    ctx.fillStyle = '#17262B';
    for (let wx = -16; wx < 10; wx += 6) ctx.fillRect(wx, -8.5, 4, 3.5);
    ctx.fillStyle = '#E24B4A'; ctx.fillRect(14, -14, 1.5, 5);
  } else {
    ctx.fillStyle = '#7A4A34';
    ctx.beginPath(); ctx.moveTo(-31, -3); ctx.lineTo(29, -3); ctx.lineTo(25, 4); ctx.lineTo(-27, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4E3226'; ctx.fillRect(-25, -8, 34, 5);
    ctx.fillStyle = '#5F5E5A'; ctx.fillRect(-20, -10, 24, 2);
    rr(14, -12, 8, 9, 1, '#33332F');
    ctx.fillStyle = '#EF9F27'; ctx.fillRect(16, -10.5, 4, 2);
  }
  ctx.restore();
}

function drawDuck(x, y, big, now, i) {
  ctx.save();
  ctx.translate(x, y);
  const s = big ? 1.7 : 1;
  ctx.scale(s, s);
  ctx.strokeStyle = 'rgba(236,246,246,0.4)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0, 3, 8, 0.15, Math.PI - 0.15); ctx.stroke();
  if (big) {
    ctx.fillStyle = '#F3CE3A';
    ctx.beginPath(); ctx.ellipse(0, 0, 5.5, 3.8, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-3.5, -4, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#E07A22';
    ctx.beginPath(); ctx.moveTo(-6.2, -4); ctx.lineTo(-9, -3.2); ctx.lineTo(-6.2, -2.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2C2C2A'; ctx.fillRect(-4.6, -5, 1.2, 1.2);
  } else {
    ctx.fillStyle = '#6E5136';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 3.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2E5B33';
    ctx.beginPath(); ctx.arc(-3.6, -3.4, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#EF9F27';
    ctx.beginPath(); ctx.moveTo(-5.8, -3.4); ctx.lineTo(-8.2, -2.8); ctx.lineTo(-5.8, -2.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F2F1EA'; ctx.fillRect(-4.8, -1.6, 2.6, 0.9);
  }
  ctx.restore();
}

function drawWater(s, now) {
  const top = FARY, bot = WBOT, h = bot - top;
  const wg = ctx.createLinearGradient(0, top, 0, bot);
  wg.addColorStop(0, '#5E838A');
  wg.addColorStop(0.5, '#6E96A0');
  wg.addColorStop(1, '#80A7AC');
  ctx.fillStyle = wg; ctx.fillRect(0, top, W, h);
  ctx.fillStyle = 'rgba(28,46,52,0.38)'; ctx.fillRect(0, top, W, 3);

  const rp = s.cam * 0.35;
  ctx.fillStyle = 'rgba(206,176,120,0.20)';
  for (let x = -(rp % 26) - 26; x < W; x += 26) {
    const wob = Math.sin(now / 460 + x * 0.35) * 2.5;
    ctx.fillRect(x + wob, top + 3, 9, 13 + Math.sin(now / 620 + x) * 3);
  }
  ctx.fillStyle = 'rgba(233,222,196,0.13)';
  for (let x = -(rp % 52) - 13; x < W; x += 52) {
    ctx.fillRect(x + Math.sin(now / 380 + x) * 2, top + 4, 4, 20);
  }

  ctx.lineWidth = 1.2;
  const rows = [
    [top + 9,  0.42, 0.026, 'rgba(224,238,238,0.28)', 10],
    [top + 17, 0.50, 0.038, 'rgba(224,238,238,0.36)', 13],
    [top + 26, 0.58, 0.052, 'rgba(238,247,247,0.44)', 17]
  ];
  for (const r of rows) {
    const ry = r[0], par = r[1], sp = r[2], seg = r[4];
    ctx.strokeStyle = r[3];
    const off = (s.cam * par + now * sp) % (seg * 2);
    ctx.beginPath();
    for (let x = -off - seg; x < W + seg; x += seg * 2) {
      const dy = Math.sin((x + off) * 0.2 + now / 500) * 0.8;
      ctx.moveTo(x, ry + dy);
      ctx.quadraticCurveTo(x + seg / 2, ry + dy - 2.2, x + seg, ry + dy);
    }
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  const span = 2600;
  const boats = [
    [340, 0, top + 14, 0.95],
    [1500, 1, bot - 8, 1.2],
    [2300, 0, top + 19, 1.05]
  ];
  for (const b of boats) {
    const x = ((b[0] - s.cam * 0.5 - now * 0.012) % span + span) % span - 120;
    if (x < -90 || x > W + 90) continue;
    const bob = Math.sin(now / 520 + b[0]) * 1.2;
    drawBoat(x, b[2] + bob, b[1], b[3], now);
  }

  const dspan = 1500;
  for (let i = 0; i < 3; i++) {
    const x = ((i * 470 + 260 - s.cam * 0.55 - now * 0.006) % dspan + dspan) % dspan - 60;
    if (x < -24 || x > W + 24) continue;
    const y = bot - 9 + Math.sin(now / 420 + i * 2.1) * 1.2;
    drawDuck(x, y, i === 1, now, i);
  }
}

function endButtons() {
  const by = H - 40;
  rr(W * 0.13, by, W * 0.32, 28, 14, '#12B6CF');
  rr(W * 0.55, by, W * 0.32, 28, 14, '#39414E');
  ctx.fillStyle = '#fff'; ctx.font = '500 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('RETRY', W * 0.29, by + 18);
  ctx.fillText('MENU', W * 0.71, by + 18);
  ctx.textAlign = 'left';
}

function draw() {
  const s = state;
  const now = Date.now();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const sky = ctx.createLinearGradient(0, 0, 0, FARY);
  sky.addColorStop(0, '#6FA8DC'); sky.addColorStop(0.65, '#9CC2E4'); sky.addColorStop(1, '#C9DDEE');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, FARY + 2);

  const sg = ctx.createRadialGradient(294, 42, 4, 294, 42, 48);
  sg.addColorStop(0, 'rgba(255,247,216,0.95)');
  sg.addColorStop(0.28, 'rgba(255,241,203,0.5)');
  sg.addColorStop(1, 'rgba(255,241,203,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(294, 42, 48, 0, TAU); ctx.fill();

  drawSkyline(s.cam * 0.12, now);

  const ca = G('cloudA'), cb = G('cloudB');
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 180 + 30 - s.cam * 0.2) % 740 + 740) % 740 - 70;
    const cy = 24 + (i * 27 % 34);
    const g = (i % 2 === 0) ? ca : cb;
    if (g) { const dh = (i % 2 === 0) ? 18 : 14, dw = g.bw * (dh / g.bh); dg(g, cx, cy, dw, dh); }
  }

  drawBirds(now);

  const pp = s.cam * 0.35;
  const pal = G('palace');
  if (pal) {
    const dh = 92, dw = pal.bw * (dh / pal.bh);
    for (let x = -(pp % dw) - dw; x < W; x += dw) dg(pal, x, FARY - dh, dw, dh);
  }
  const vt = G('victoria');
  for (let i = Math.floor(pp / 640) - 1; i < (pp + W) / 640 + 1; i++) {
    const tx = i * 640 - pp + 170;
    if (tx < -80 || tx > W + 80) continue;
    if (vt) { const dh = 150, dw = vt.bw * (dh / vt.bh); dg(vt, tx, FARY - dh, dw, dh); }
  }

  const tp = s.cam * 0.42;
  const tr = G('tree');
  for (let i = Math.floor(tp / 460) - 1; i < (tp + W) / 460 + 1; i++) {
    const tx = i * 460 - tp + 90;
    if (tx < -50 || tx > W + 50) continue;
    if (tr) { const dh = 48, dw = tr.bw * (dh / tr.bh); dg(tr, tx - dw/2, FARY + 2 - dh, dw, dh); }
  }

  drawWater(s, now);

  const bal = G('balustrade');
  if (bal) {
    const dh = 26, dw = bal.bw * (dh / bal.bh);
    for (let x = -(s.cam % dw) - dw; x < W; x += dw) dg(bal, x, GROUND - dh, dw, dh);
  }
  const pr = G('pier'), lp = G('lamp');
  for (let wx2 = 0; wx2 < GOAL + 600; wx2 += 150) {
    const sx = wx2 - s.cam;
    if (sx < -40 || sx > W + 40) continue;
    if (pr) { const dh = 30, dw = pr.bw * (dh / pr.bh); dg(pr, sx - dw/2, GROUND - dh, dw, dh); }
    if ((wx2 / 150) % 2 === 0 && lp) {
      const dh = 92, dw = lp.bw * (dh / lp.bh);
      dg(lp, sx - dw/2, GROUND - 24 - dh, dw, dh);
    }
  }

  for (const p of s.props) {
    const sx = p.x - s.cam;
    if (sx > W + 60 || sx < -170) continue;
    drawProp(p, sx);
  }

  const rd = G('road');
  for (const seg of SEGS) {
    const sx = seg.x - s.cam;
    if (sx > W || sx + seg.w < 0) continue;
    if (rd) {
      ctx.save();
      ctx.beginPath(); ctx.rect(sx, GROUND, seg.w, H - GROUND); ctx.clip();
      const dh = 30, dw = rd.bw * (dh / rd.bh);
      for (let x = -(s.cam % dw) - dw; x < W + dw; x += dw) {
        dg(rd, x, GROUND, dw, dh);
        ctx.fillStyle = '#3E3E44'; ctx.fillRect(x - 0.5, GROUND + dh - 0.5, dw + 1, H - GROUND - dh + 0.5);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#55555B'; ctx.fillRect(sx, GROUND, seg.w, H - GROUND);
    }
    const de = G('decal');
    for (let dx = 105; dx < seg.w - 60; dx += 210) {
      const j = ((seg.x + dx) * 13) % 12;
      const mx = sx + dx, my = GROUND + 14 + j * 0.6;
      if (de) dg(de, mx - 20, my - 4, 40, 40 * de.bh / de.bw);
    }
    ctx.fillStyle = '#EDEAE0';
    for (let dx = 24; dx < seg.w - 20; dx += 52) ctx.fillRect(sx + dx, GROUND + 27, 26, 4);
  }
  for (let i = 0; i < SEGS.length - 1; i++) drawPothole(SEGS[i].x + SEGS[i].w, SEGS[i + 1].x);

  const benX = GOAL - s.cam + 30;
  if (benX < W + 80) {
    const bb = G('bigben');
    if (bb) { const dh = 215, dw = bb.bw * (dh / bb.bh); dg(bb, benX, GROUND - dh, dw, dh); }
  }

  for (const p of s.pigeons) {
    const sx = p.x - s.cam;
    if (sx > W + 40 || sx < -40 || p.y < -20) continue;
    drawPigeon(p, sx);
  }

  for (const it of s.items) {
    if (it.taken) continue;
    const sx = it.x - s.cam;
    if (sx > W + 70 || sx < -70) continue;
    drawItem(it, sx);
  }
  for (const e of s.enemies) {
    const sx = e.x - s.cam;
    if (sx > W + 30 || sx < -50) continue;
    drawEnemy(e, sx);
  }
  if (s.mode === 'nige') drawNige(s);
  else drawBinface(s.px, s.py, s.squish);

  if (s.caps.length) {
    const c = s.caps[0]; c.t--;
    ctx.font = '400 12px sans-serif';
    const tw = ctx.measureText(c.msg).width;
    ctx.fillStyle = 'rgba(20,20,25,0.85)';
    ctx.beginPath(); ctx.roundRect(W/2 - tw/2 - 10, 10, tw + 20, 24, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(c.msg, W/2, 26); ctx.textAlign = 'left';
    if (c.t <= 0) s.caps.shift();
  }

  if (s.over || s.won) {
    ctx.fillStyle = 'rgba(20,20,25,0.82)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    if (s.mode === 'nige') {
      const car = G('nferrari');
      if (car) {
        const dh = 58, dw = car.bw * (dh / car.bh);
        dg(car, W/2 - dw/2, 100 - dh, dw, dh);
      }
      if (s.won && s.money >= NIGE_TARGET) {
        ctx.fillStyle = '#F5D34A';
        ctx.font = '500 20px sans-serif';
        ctx.fillText('PARLIAMENT REACHED!', W/2, 132);
        ctx.fillStyle = '#E8ECF2';
        ctx.font = '400 13px sans-serif';
        ctx.fillText('Declared war chest: ' + fmtMoney(s.money), W/2, 158);
        ctx.fillText('The Member for Clacton-on-Sea rides again.', W/2, 178);
      } else if (s.won) {
        ctx.fillStyle = '#E24B4A';
        ctx.font = '500 22px sans-serif';
        ctx.fillText('SCANDAL!', W/2, 132);
        ctx.fillStyle = '#E8ECF2';
        ctx.font = '400 13px sans-serif';
        ctx.fillText('Arrived with only ' + fmtMoney(s.money) + '.', W/2, 158);
        ctx.fillText('The Standards Committee will see you now.', W/2, 178);
      } else {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '500 22px sans-serif';
        ctx.fillText('BINNED!', W/2, 132);
        ctx.fillStyle = '#E8ECF2';
        ctx.font = '400 13px sans-serif';
        ctx.fillText('Nige has been binned outside Parliament.', W/2, 158);
        ctx.fillText('War chest: ' + fmtMoney(s.money) + ' (frozen pending inquiry)', W/2, 178);
      }
      ctx.fillStyle = '#fff'; ctx.font = '400 14px sans-serif';
      ctx.fillText('Bodyguards remaining: ' + guardsAlive() + '/4', W/2, 208);
      endButtons();
    } else if (s.won) {
      const wf = G('winface');
      if (wf) {
        const dh = 84, dw = wf.bw * (dh / wf.bh);
        dg(wf, W/2 - dw/2, 118 - dh, dw, dh);
      }
      ctx.fillStyle = '#F5D34A';
      ctx.font = '500 19px sans-serif';
      ctx.fillText('CONGRATULATIONS', W/2, 146);
      ctx.fillText('COUNT BINFACE MP!', W/2, 168);
      ctx.fillStyle = '#E8ECF2';
      ctx.font = '400 12px sans-serif';
      ctx.fillText('You are duly elected as the Member of', W/2, 192);
      ctx.fillText('Parliament for Clacton-on-Sea!', W/2, 208);
      ctx.fillStyle = '#fff'; ctx.font = '400 14px sans-serif';
      ctx.fillText('Manifesto pledges: ' + s.pledges + '/18', W/2, 230);
      ctx.fillText('Final score: ' + s.score, W/2, 250);
      endButtons();
    } else {
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '500 20px sans-serif';
      ctx.fillText('Binned!', W/2, H/2 - 40);
      ctx.font = '400 14px sans-serif';
      ctx.fillText('Consigned to landfill. Again.', W/2, H/2 - 16);
      ctx.fillText('Manifesto pledges: ' + s.pledges + '/18', W/2, H/2 + 8);
      ctx.fillText('Final score: ' + s.score, W/2, H/2 + 28);
      endButtons();
    }
    ctx.textAlign = 'left';
  }
}

step();
</script>
</body>
</html>
